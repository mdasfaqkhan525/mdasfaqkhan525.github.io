<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Asfaqkhan J – Full Stack Developer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#060606;--panel:#111;--panel2:#181818;--ink:#F4F4F4;--muted:#A8A8A8;--line:#2B2B2B;--red:#E50914;--red2:#FF4D4D;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Figtree,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.08;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--red2);outline-offset:3px;border-radius:4px}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:var(--p,0%);background:linear-gradient(90deg,var(--red),var(--red2));z-index:21}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(6,6,6,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:14px}
.logo{font:800 20px 'Bricolage Grotesque',sans-serif;text-decoration:none}.logo b{color:var(--red)}
nav{display:flex;gap:6px;overflow-x:auto}
nav a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:500;white-space:nowrap;transition:.2s}
nav a:hover{color:var(--ink)}
nav a.on{color:#fff;background:var(--red)}
.btn{font:600 15px Figtree,sans-serif;padding:12px 22px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:.25s}
.btn:hover{border-color:var(--red);transform:translateY(-2px)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 28px rgba(229,9,20,.35)}
.btn.primary:hover{box-shadow:0 12px 36px rgba(229,9,20,.55)}
section{padding:84px 0}
h2{font-size:clamp(30px,4.5vw,46px);margin-bottom:34px;font-weight:800}
h2::after{content:"";display:block;width:56px;height:4px;background:var(--red);margin-top:14px;border-radius:2px}
.hero{position:relative;padding:76px 0 60px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at var(--mx,70%) var(--my,30%),rgba(229,9,20,.28),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.hi{color:var(--red2);font-weight:600;margin-bottom:10px}
h1{font-size:clamp(44px,8vw,86px);font-weight:800;letter-spacing:-.03em;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.role{font:700 clamp(20px,3vw,28px) 'Bricolage Grotesque',sans-serif;margin:16px 0;min-height:1.4em;color:var(--red2)}
.caret{display:inline-block;width:3px;height:1em;background:var(--red);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
.lead{max-width:33em;color:var(--muted);font-size:19px;margin:0 0 28px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.stack{display:grid;gap:8px}
.stack button{font:700 18px 'Bricolage Grotesque',sans-serif;text-align:left;padding:15px 18px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;cursor:pointer;transition:.25s}
.stack button:hover{border-left-color:var(--red2)}
.stack button[aria-pressed="true"]{border-left-color:var(--red);background:var(--panel2);transform:translateX(12px);border-color:var(--red)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:12px;min-height:122px}
.detail p{margin:0 0 10px}
.tags{display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:0;list-style:none}
.tags li{font-size:14px;padding:3px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;padding:8px 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:10px;padding:20px}
.stat b{display:block;font:800 44px 'Bricolage Grotesque',sans-serif;color:#fff}
.stat span{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chips button{font:500 15px Figtree,sans-serif;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:.2s}
.chips button:hover{border-color:var(--red)}
.chips button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px}
.card{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,border-color .25s,box-shadow .25s}
.card:hover{border-color:var(--red);box-shadow:0 18px 50px rgba(229,9,20,.18)}
.card h3{font-size:25px;margin-bottom:10px}
.card p{margin:0 0 16px;color:var(--muted)}
.more{display:block;margin-top:16px;color:var(--red2);font-weight:600}
.timeline{border-left:3px solid var(--red);padding-left:26px;position:relative}
.timeline::before{content:"";position:absolute;left:-10px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px rgba(229,9,20,.25)}
.timeline h3{font-size:25px}.timeline .meta{color:var(--muted);margin:6px 0 14px}
.timeline ul{padding-left:20px;margin:0}.timeline li{margin-bottom:9px}
.edu{display:grid;gap:14px;margin-top:8px}
.edu div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.edu em{font-style:normal;color:var(--red2);font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{font:600 15px Figtree,sans-serif;padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.skillbox{display:flex;gap:12px;flex-wrap:wrap}
.skillbox span{padding:12px 20px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:500;animation:pop .35s both}
.skillbox span:hover{border-color:var(--red);color:var(--red2)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
form{display:grid;gap:16px;max-width:580px}
label{display:grid;gap:6px;font-weight:600}
input,textarea{font:400 17px Figtree,sans-serif;padding:13px 15px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);width:100%;transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--red)}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--red2)}
.err{color:var(--red2);font-weight:500;font-size:15px}
.ok{padding:14px 16px;border-radius:10px;border:1.5px solid var(--red);margin:0}
footer{padding:30px 0 46px;color:var(--muted);border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:30;display:grid;place-items:center;padding:20px;animation:fade .2s}
.modal{background:var(--panel);border:1px solid var(--red);border-radius:16px;padding:30px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 0 60px rgba(229,9,20,.3);animation:rise .3s both}
.modal h3{font-size:28px;margin-bottom:12px}.modal ul.l{padding-left:20px;color:var(--muted)}
@keyframes fade{from{opacity:0}}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.photo{position:relative;width:min(100%,360px);margin:0 auto;aspect-ratio:4/5;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}
.photo img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;border-radius:26px;border:2px solid var(--red)}
.ring{position:absolute;inset:-12px;border-radius:34px;background:conic-gradient(from var(--a),var(--red),transparent 28%,var(--red2) 58%,transparent 84%,var(--red));filter:blur(16px);opacity:.8;animation:spin 6s linear infinite}
@keyframes spin{to{--a:360deg}}
.badge{position:absolute;z-index:2;padding:7px 14px;border-radius:999px;background:rgba(17,17,17,.94);border:1px solid var(--red);font:600 14px Figtree,sans-serif;animation:float 4s ease-in-out infinite}
.b1{top:8%;left:-7%}.b2{top:32%;right:-7%;animation-delay:.8s}.b3{bottom:24%;left:-7%;animation-delay:1.6s}.b4{bottom:6%;right:-5%;animation-delay:2.4s}
@keyframes float{50%{transform:translateY(-10px)}}
.explore{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:start}.explore .detail{margin-top:0}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.explore{grid-template-columns:1fr}.explore .detail{margin-top:12px}section{padding:56px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>

/* ---------- Dynamic helpers ---------- */
function useInView() {
  const ref = useRef(null); const [v, setV] = useState(false);
  useEffect(() => {
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); o.disconnect(); } }, { threshold: 0.15 });
    o.observe(ref.current); return () => o.disconnect();
  }, []);
  return [ref, v];
}
function Rv({ children, delay = 0 }) {
  const [r, v] = useInView();
  return <div ref={r} className={"rv" + (v ? " in" : "")} style={{ transitionDelay: delay + "ms" }}>{children}</div>;
}
function Counter({ to, suffix, label }) {
  const [r, v] = useInView(); const [n, setN] = useState(0);
  useEffect(() => {
    if (!v) return; let s; let id;
    const tick = t => { s = s || t; const p = Math.min((t - s) / 1300, 1); setN(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) id = requestAnimationFrame(tick); };
    id = requestAnimationFrame(tick); return () => cancelAnimationFrame(id);
  }, [v]);
  return <div className="stat" ref={r}><b>{n}{suffix}</b><span>{label}</span></div>;
}
function Typed() {
  const [i, setI] = useState(0); const [t, setT] = useState(""); const [del, setDel] = useState(false);
  useEffect(() => {
    const w = ROLES[i];
    const id = setTimeout(() => {
      if (!del) { setT(w.slice(0, t.length + 1)); if (t.length + 1 === w.length) setTimeout(() => setDel(true), 1400); }
      else { setT(w.slice(0, t.length - 1)); if (t.length - 1 === 0) { setDel(false); setI((i + 1) % ROLES.length); } }
    }, del ? 35 : 75);
    return () => clearTimeout(id);
  }, [t, del, i]);
  return <div className="role" aria-label={ROLES.join(", ")}>{t}<span className="caret" /></div>;
}

function Photo() {
  const move = e => { const r = e.currentTarget.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width - 0.5; const y = (e.clientY - r.top) / r.height - 0.5; e.currentTarget.style.setProperty("--ry", (x * 14) + "deg"); e.currentTarget.style.setProperty("--rx", (-y * 14) + "deg"); };
  const reset = e => { e.currentTarget.style.setProperty("--ry", "0deg"); e.currentTarget.style.setProperty("--rx", "0deg"); };
  return (
    <div className="photo" onMouseMove={move} onMouseLeave={reset}>

function Tilt({ children, onClick }) {

function Projects({ open }) {
  const filters = ["All", ...Array.from(new Set(PROJECTS.flatMap(p => p.tags)))];
  const [f, setF] = useState("All");
  const shown = PROJECTS.filter(p => f === "All" || p.tags.includes(f));
  return (
    <section id="projects"><div className="wrap">
      <Rv><h2>Projects</h2>
      <div className="chips" role="group" aria-label="Filter projects">{filters.map(x => <button key={x} aria-pressed={f === x} onClick={() => setF(x)}>{x}</button>)}</div></Rv>
      <div className="projects">
        {shown.map((p, n) => (
          <Rv key={p.title} delay={n * 120}>
            <Tilt onClick={() => open(p)}>
              <h3>{p.title}</h3><p>{p.summary}</p>
              <ul className="tags">{p.stack.slice(0, 5).map(t => <li key={t}>{t}</li>)}</ul>
              <span className="more">View details</span>
            </Tilt>
          </Rv>
        ))}
      </div>
    </div></section>
  );
}

function Experience() {
  return (
    <section id="experience"><div className="wrap">
      <Rv><h2>Experience</h2>
      <div className="timeline">
        <h3>Full Stack Developer Intern, Hani Solution</h3>
        <p className="meta">Chennai · July 2025 to present</p>
        <ul>
          <li>Built full-stack modules with React.js, Laravel, and MySQL, including normalized schemas and optimized queries.</li>
          <li>Designed and integrated REST APIs for candidate registration, authentication, profile management, and data retrieval.</li>
          <li>Contributed to 8+ core modules: Candidate Registration, Employee Referral, User Management, System Configuration, Authentication, and Course Management.</li>
          <li>Ran manual QA across functional, validation, boundary value, and negative cases, and documented 40+ defects.</li>
          <li>Worked with frontend, backend, and QA teams using Git and Agile practices.</li>
        </ul>
      </div></Rv>
      <Rv><h2 style={{ marginTop: 64 }}>Education</h2>
      <div className="edu">
        <div><span>M.Sc. Computer Science, The New College Institution of Higher Education, Chennai</span><em>2025–2027 (pursuing)</em></div>
        <div><span>B.Sc. Computer Science, Annai College of Arts and Science, Kumbakonam</span><em>2022–2025</em></div>
      </div></Rv>
    </div></section>
  );
}

function Skills() {
  const keys = Object.keys(SKILLS); const [k, setK] = useState(keys[0]);
  return (
    <section id="skills"><div className="wrap"><Rv>
      <h2>Skills</h2>
      <div className="tabs" role="group" aria-label="Skill categories">{keys.map(x => <button key={x} aria-pressed={k === x} onClick={() => setK(x)}>{x}</button>)}</div>
      <div className="skillbox" key={k}>{SKILLS[k].map((s, n) => <span key={s} style={{ animationDelay: n * 60 + "ms" }}>{s}</span>)}</div>
    </Rv></div></section>
  );
}

function Contact() {
  const [v, setV] = useState({ name: "", email: "", message: "" }); const [errors, setErrors] = useState({}); const [sent, setSent] = useState(false);
  const set = k => e => setV({ ...v, [k]: e.target.value });
  const submit = e => {
    e.preventDefault(); const er = {};
    if (v.name.trim().length < 2) er.name = "Enter your name (at least 2 characters).";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) er.email = "Enter a valid email address, like name@example.com.";
    if (v.message.trim().length < 10) er.message = "Write a message of at least 10 characters.";
    setErrors(er); setSent(false); if (Object.keys(er).length) return;
    window.location.href = "mailto:" + PROFILE.email + "?subject=" + encodeURIComponent("Portfolio message from " + v.name) + "&body=" + encodeURIComponent(v.message + "\n\n" + v.name + " (" + v.email + ")");
    setSent(true);
  };
  const field = (k, label, props) => (
    <label>{label}
      {k === "message" ? <textarea rows="5" value={v[k]} onChange={set(k)} aria-invalid={!!errors[k]} /> : <input value={v[k]} onChange={set(k)} aria-invalid={!!errors[k]} {...props} />}
      {errors[k] && <span className="err" role="alert">{errors[k]}</span>}
    </label>
  );
  return (
    <section id="contact"><div className="wrap"><Rv>
      <h2>Let’s work together</h2>
      <form onSubmit={submit} noValidate>
        {field("name", "Your name", { autoComplete: "name" })}
        {field("email", "Your email", { type: "email", autoComplete: "email" })}
        {field("message", "Message")}
        <div><button className="btn primary" type="submit">Send message</button></div>
        {sent && <p className="ok" role="status">Your email app opened with the message ready to send.</p>}
      </form>
    </Rv></div></section>
  );
}

function Modal({ p, close }) {
  useEffect(() => { const k = e => e.key === "Escape" && close(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  return (
    <div className="ov" onClick={close}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={p.title} onClick={e => e.stopPropagation()}>
        <h3>{p.title}</h3>
        <p style={{ color: "var(--muted)" }}>{p.summary}</p>
        <ul className="l">{p.points.map(x => <li key={x}>{x}</li>)}</ul>
        <ul className="tags" style={{ margin: "16px 0 22px" }}>{p.stack.map(t => <li key={t}>{t}</li>)}</ul>
        <button className="btn primary" autoFocus onClick={close}>Close</button>
      </div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState(""); const [proj, setProj] = useState(null);
  useEffect(() => {
    const bar = document.querySelector(".bar");
    const onScroll = () => { const h = document.documentElement; bar.style.setProperty("--p", (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%"); };
    window.addEventListener("scroll", onScroll, { passive: true });
    const o = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActive(e.target.id)), { rootMargin: "-45% 0px -50% 0px" });
    ["top", "projects", "experience", "skills", "contact"].forEach(id => o.observe(document.getElementById(id)));
    return () => { window.removeEventListener("scroll", onScroll); o.disconnect(); };
  }, []);
  return (
    <>
      <div className="bar" />
      <Header active={active} />
      <main><Hero /><Stats /><Explorer /><Projects open={setProj} /><Experience /><Skills /><Contact /></main>
      <footer><div className="wrap">{PROFILE.name} · {PROFILE.location}</div></footer>
      {proj && <Modal p={proj} close={() => setProj(null)} />}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
